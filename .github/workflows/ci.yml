# Checks every push to main and every pull request: formatting, clippy (zero warnings), tests.
# Nothing is built for distribution here: releases come from release.yml on a vX.Y.Z tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SWYTCH_REQUIRE_RESOURCES: "1"

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # rustup refuses to install from a toolchain file whose channel names a target (the runner's
      # default host is MSVC), so the GNU toolchain is installed explicitly; the file then selects it.
      - name: Rust toolchain (stable-x86_64-pc-windows-gnu)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --component rustfmt,clippy
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: windres (embeds version info and icon)
        shell: pwsh
        run: ./.github/scripts/find-windres.ps1

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked
