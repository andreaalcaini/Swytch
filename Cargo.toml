[package]
name = "swytch"
version = "2.1.0"
edition = "2021"
description = "Switches the monitor input over DDC/CI (VCP 0x60) from global hotkeys and a tray icon"
license = "MIT"
repository = "https://github.com/andreaalcaini/Swytch"
# build.rs embeds the version info and the icon into the exe.

[[bin]]
name = "Swytch"
path = "src/main.rs"

# No dependencies: plain Win32 (see src/win32.rs).
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
